<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>Stumble</title>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="logo">Stumble</h1>
      <p class="tagline">Rediscover the internet</p>
    </div>

    <button id="stumble-btn" class="stumble-btn">
      <span class="btn-icon">⚡</span>
      <span class="btn-text">Stumble</span>
    </button>

    <div class="feed-badge" id="feed-badge">
      <!-- Shows which feed the last stumble came from -->
    </div>

    <div class="footer">
      <span class="version">v0.1</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
